<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="70%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a3d62"/>
      <stop offset="30%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="85%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0055ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0055ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="600" fill="url(#bgGrad)"/>
  <rect width="1200" height="600" fill="url(#blueGlow)"/>
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#0055ff" stroke-opacity="0.05" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <g filter="url(#glow)">
    <text x="600" y="320" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="220" font-weight="900" fill="url(#textGrad)" letter-spacing="-8">SYS</text>
  </g>
  <text x="600" y="430" text-anchor="middle" font-family="'Segoe Script', 'Brush Script MT', cursive" font-size="52" font-style="italic" fill="#00f0ff" letter-spacing="4">Studio</text>
  <line x1="400" y1="500" x2="800" y2="500" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)"/>
  <circle cx="200" cy="150" r="3" fill="#00f0ff" opacity="0.6" filter="url(#softGlow)"/>
  <circle cx="1000" cy="120" r="2" fill="#0055ff" opacity="0.5" filter="url(#softGlow)"/>
  <circle cx="150" cy="450" r="2.5" fill="#00f0ff" opacity="0.4" filter="url(#softGlow)"/>
  <circle cx="1050" cy="480" r="3" fill="#0055ff" opacity="0.5" filter="url(#softGlow)"/>
</svg>