<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bgGrad" cx="72%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0a3d62"/>
      <stop offset="25%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="85%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#0055ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0055ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow2" cx="15%" cy="85%" r="35%">
      <stop offset="0%" stop-color="#0055ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0055ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#0055ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#blueGlow)"/>
  <rect width="1920" height="1080" fill="url(#blueGlow2)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <circle cx="1600" cy="200" r="4" fill="#00f0ff" opacity="0.5" filter="url(#softGlow)"/>
  <circle cx="200" cy="900" r="3" fill="#0055ff" opacity="0.4" filter="url(#softGlow)"/>
  <circle cx="1750" cy="850" r="3.5" fill="#00f0ff" opacity="0.45" filter="url(#softGlow)"/>
  <circle cx="300" cy="150" r="2.5" fill="#0055ff" opacity="0.4" filter="url(#softGlow)"/>
</svg>